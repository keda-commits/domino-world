<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界一長いドミノ倒し</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div id="loading"><div class="ld-title">世界一長いドミノ倒し</div><div class="ld-sub">準備中…</div></div>

    <!-- 左上：ステージと次の目標 -->
    <div id="hud-tl" class="hud">
      <div id="stage-name" class="hud-stage"></div>
      <div id="next-goal" class="hud-sub"></div>
    </div>

    <!-- 上中央：経験値 -->
    <div id="hud-xp" class="hud">
      <span id="xp-lv" class="xp-lv">Lv.1</span>
      <div class="xp-bar"><div id="xp-fill"></div></div>
      <span id="xp-left" class="xp-left"></span>
      <span id="xp-tickets" class="xp-tickets hidden"></span>
    </div>

    <!-- 右上：カメラとシステム -->
    <div id="hud-tr" class="hud">
      <div class="seg" id="cam-views">
        <button data-view="build" title="建設現場を見る (B)">建設</button>
        <button data-view="view" title="低い目線で眺める (V)">観賞</button>
        <button data-view="chain" title="連鎖の先頭を追いかける (F)">追跡</button>
        <button data-view="overview" title="部屋全体 (O)">俯瞰</button>
        <button id="b-cam-reset" title="カメラを戻す (Home)">⟲</button>
      </div>
      <div class="seg"><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>
      <button id="b-pause" title="一時停止 (P)">⏸</button>
      <button id="b-menu" title="メニュー（記録・ビルド・人員・設定）">≡</button>
    </div>


    <!-- 連鎖中 -->
    <div id="runhud" class="hidden"><span id="rh-count">0</span><small>連鎖</small><div id="rh-prog"><i></i><b></b></div><div id="rh-rec" class="hidden">NEW RECORD！</div><div id="rh-piggy" class="hidden">🐷 <b>0</b></div></div>
    <div id="run-view" class="hidden"><button data-rv="chase" class="on">🎥 連鎖追跡</button><button data-rv="overview">🗺 俯瞰</button></div>
    <div id="hover-tip" class="hidden"></div>

    <!-- 下：建設状況と操作 -->
    <div id="bottom" class="hud">
      <div id="warns"></div>
      <div id="progress-line">
        <div class="pl-bar"><div id="pl-fill"></div><div id="pl-marks"></div></div>
        <div id="pl-text"></div>
      </div>
      <div class="bt-row">
        <div class="tools">
          <button data-tool="play" class="tool on" title="ドラッグでドミノをつかむ・離して置く・投げる／ダブルクリックでデコピン (1)">🖐<span>手</span></button>
          <button data-tool="pieces" class="tool" id="b-pieces" title="ベル・バリケード・センサーを置く (2)">🧩<span>配置</span></button>
          <button data-tool="test" class="tool" title="区間テスト (3)">🧪<span>試し倒し</span></button>
          <button data-tool="stopper" class="tool" title="ストッパーのロック切替 (4)">🔒<span>ロック</span></button>
        </div>
        <button id="b-run" class="run-btn" title="倒す！ (Enter)">▶ 倒す！</button>
        <div class="tools">
          <button id="b-tidy" class="tool" title="倒れたドミノを起こす（長押し / R）">🧹<span>片付け</span></button>
          <button id="b-rewind" class="tool" title="ぜんまい巻き戻し">⏪<span id="rewind-sub">×0</span></button>
        </div>
      </div>
      <div id="piece-pop" class="hidden"></div>
      <div id="tool-hint"></div>
    </div>

    <!-- 連鎖終了の短い演出 -->
    <div id="flash" class="hidden"></div>

    <!-- ガチャ（3D 演出の上にのせる説明カード） -->
    <div id="gacha3d" class="hidden">
      <div class="g3-head"><div class="g3-title"></div><div class="g3-left"></div></div>
      <div class="g3-cards"></div>
      <div class="g3-msg"></div>
      <div class="g3-ctrl"><button id="g3-fast">⏩ 早送り</button><button id="g3-skip">⏭ スキップ (Space)</button></div>
    </div>

    <!-- メニュー -->
    <div id="panel" class="hidden">
      <div class="pn-head">
        <div class="pn-tabs">
          <button data-tab="records" class="on">記録</button><button data-tab="build">ビルド</button><button data-tab="crew">人員</button><button data-tab="stages">ステージ</button><button data-tab="settings">設定</button><button data-tab="help">遊び方</button>
        </div>
        <button id="pn-close">✕</button>
      </div>
      <div id="pn-body"></div>
    </div>

    <div id="dialog" class="modal hidden"><div class="modal-card" id="dialog-card"></div></div>
    <div id="floaters"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
